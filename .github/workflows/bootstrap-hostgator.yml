name: Bootstrap HostGator Git checkout

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BOOTSTRAP to initialize the current HostGator Laravel directory from GitHub.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hostgator-production
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event.inputs.confirmation == 'BOOTSTRAP'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOSTGATOR_SSH_HOST: sh00092.hostgator.com.br
      HOSTGATOR_SSH_USER: ${{ secrets.HOSTGATOR_SSH_USER }}
      HOSTGATOR_APP_PATH: ${{ secrets.HOSTGATOR_APP_PATH }}
      HOSTGATOR_SSH_KNOWN_HOSTS: sh00092.hostgator.com.br ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICEeMa+L58GFrtFbrb4jp/SQW4pIR3Ix5KeHiKbGJdxT
      HOSTGATOR_SSH_PRIVATE_KEY: ${{ secrets.HOSTGATOR_SSH_PRIVATE_KEY }}
      HOSTGATOR_SSH_KEY_PASSPHRASE: ${{ secrets.HOSTGATOR_SSH_KEY_PASSPHRASE }}

    steps:
      - name: Configure SSH authentication
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOSTGATOR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTGATOR_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          cat > ~/.ssh/askpass <<'EOF'
          #!/usr/bin/env sh
          printf '%s\n' "$HOSTGATOR_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass
          timeout 45s env DISPLAY=1 SSH_ASKPASS="$HOME/.ssh/askpass" SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/id_ed25519 < /dev/null || { echo "::error title=Senha da chave SSH invalida::Atualize HOSTGATOR_SSH_KEY_PASSPHRASE com a senha da chave privada."; exit 1; }
          rm -f ~/.ssh/askpass

      - name: Initialize the server checkout without touching .env or storage
        run: |
          test "$HOSTGATOR_SSH_USER" = "a4d58b41" || { echo "::error title=HOSTGATOR_SSH_USER invalido::Atualize o secret com o usuario do cPanel, sem espacos."; exit 1; }
          test "$HOSTGATOR_APP_PATH" = "/home2/a4d58b41/public_html/laravel_app" || { echo "::error title=HOSTGATOR_APP_PATH invalido::Atualize o secret com o caminho absoluto do Laravel."; exit 1; }
          ssh -l "$HOSTGATOR_SSH_USER" -o BatchMode=yes -o StrictHostKeyChecking=yes "$HOSTGATOR_SSH_HOST" "set -e; test -d '$HOSTGATOR_APP_PATH'; cd '$HOSTGATOR_APP_PATH'; test ! -d .git; backup_dir=\"\$HOME/iatioben-backups/\$(date +%Y%m%d-%H%M%S)\"; mkdir -p \"\$backup_dir\"; test ! -f .env || cp .env \"\$backup_dir/.env\"; git init; git remote add origin https://github.com/sodate-tf/tiobenphp.git; git fetch --depth=1 origin main; git reset --hard origin/main; test ! -f \"\$backup_dir/.env\" || cp \"\$backup_dir/.env\" .env; composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader; php artisan optimize:clear; php artisan view:cache"