name: Deploy Laravel to HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostgator-production
  cancel-in-progress: false

jobs:
  deploy:
    # Enable this repository variable only after the one-time server bootstrap.
    if: vars.HOSTGATOR_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOSTGATOR_SSH_HOST: sh00092.hostgator.com.br
      HOSTGATOR_SSH_USER: ${{ secrets.HOSTGATOR_SSH_USER }}
      HOSTGATOR_APP_PATH: ${{ secrets.HOSTGATOR_APP_PATH }}
      HOSTGATOR_SSH_KNOWN_HOSTS: sh00092.hostgator.com.br ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICEeMa+L58GFrtFbrb4jp/SQW4pIR3Ix5KeHiKbGJdxT
      HOSTGATOR_SSH_PRIVATE_KEY: ${{ secrets.HOSTGATOR_SSH_PRIVATE_KEY }}
      HOSTGATOR_SSH_KEY_PASSPHRASE: ${{ secrets.HOSTGATOR_SSH_KEY_PASSPHRASE }}

    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Validate Laravel source
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          php -l app/Http/Controllers/SitemapController.php
          php -l app/Http/Controllers/Public/BlogController.php
          php artisan route:list --name=sitemap.terco
          php artisan route:list --name=liturgia.guides

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build production assets
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Configure SSH authentication
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOSTGATOR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTGATOR_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          cat > ~/.ssh/askpass <<'EOF'
          #!/usr/bin/env sh
          printf '%s\n' "$HOSTGATOR_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass
          DISPLAY=1 SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/id_ed25519 < /dev/null
          rm -f ~/.ssh/askpass
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$HOSTGATOR_SSH_USER@$HOSTGATOR_SSH_HOST" "test -d '$HOSTGATOR_APP_PATH/.git'"

      - name: Upload the Vite build as one consistent release
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -r public/build "$HOSTGATOR_SSH_USER@$HOSTGATOR_SSH_HOST:$HOSTGATOR_APP_PATH/public/"

      - name: Update Laravel and clear stale caches
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$HOSTGATOR_SSH_USER@$HOSTGATOR_SSH_HOST" "set -e; cd '$HOSTGATOR_APP_PATH'; git fetch --prune origin main; git checkout main; git reset --hard origin/main; composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader; php artisan migrate --force; php artisan optimize:clear; if php artisan list --raw | grep -qx 'responsecache:clear'; then php artisan responsecache:clear; fi; php artisan view:cache"